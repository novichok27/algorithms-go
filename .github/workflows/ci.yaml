name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v6

      - name: Установить Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Проверить форматирование
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...